<!DOCTYPE html>
<html lang="en" data-root="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sir Gary's Mods</title>
    <meta name="description" content="Sir Gary's Mods: challenge mods, randomizers and patches for Pokémon, Ratchet & Clank and more, made for content creators. Free downloads with install guides.">
    <meta name="theme-color" content="#05060d">
    <meta name="color-scheme" content="dark">
    <link rel="canonical" href="https://sirgary-y.github.io/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Sir Gary's Mods">
    <meta property="og:title" content="Sir Gary's Mods">
    <meta property="og:description" content="Challenge mods, randomizers and patches for Pokémon, Ratchet & Clank and more.">
    <meta property="og:image" content="https://sirgary-y.github.io/assets/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://sirgary-y.github.io/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@SirGary_y">
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="preload" href="assets/data/mods.json" as="fetch" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Marcellus&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/site.js" defer></script>
    <script src="assets/js/mods.js" defer></script>
    <script src="assets/js/fx.js" defer></script>
</head>
<body data-page="home">
    <a class="skip-link" href="#catalog" data-i18n="nav.skip">Skip to the mods</a>
    <div class="backdrop" aria-hidden="true"></div>

    <header id="site-nav" class="site-nav"></header>

    <main>
        <section class="hero">
            <div class="hero-cosmos" aria-hidden="true">
                <div class="hero-glow"></div>
                <div class="hero-sunburst"></div>
                <img class="sigil sigil-outer" src="assets/sigil-outer.svg" alt="" width="780" height="780" decoding="async">
                <img class="sigil sigil-inner" src="assets/sigil-inner.svg" alt="" width="468" height="468" decoding="async">
                <span class="shooting-star"></span>
                <span class="shooting-star"></span>
            </div>
            <div class="container hero-inner">
                <div class="ornament" aria-hidden="true"><span></span></div>
                <h1 class="logo">Sir Gary's <span>Mods</span></h1>
                <p class="subtitle" data-i18n="nav.subtitle">A Curated Collection of my Videogame Mods</p>
                <a class="hero-cta" href="#catalog"><span data-i18n="hero.cta">Browse the mods</span>
                    <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#chevron-down"></use></svg></a>
            </div>
        </section>

        <div class="container">
            <section id="featured-mod" class="featured-wrap" hidden></section>

            <section id="catalog" class="catalog" tabindex="-1">
                <div class="section-head"><h2 data-i18n="catalog.title">The Collection</h2></div>
                <div class="toolbar">
                    <div class="field field-search">
                        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg>
                        <input type="search" id="search-input" autocomplete="off" spellcheck="false"
                            data-i18n-placeholder="search.placeholder" placeholder="Search mods, games or tags..."
                            data-i18n-aria="search.placeholder" aria-label="Search mods">
                        <button type="button" id="search-clear" class="icon-btn" hidden data-i18n-aria="search.clear" aria-label="Clear search">
                            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#x"></use></svg>
                        </button>
                    </div>
                    <label class="field field-select">
                        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#gamepad"></use></svg>
                        <span class="visually-hidden" data-i18n="filter.game">Game</span>
                        <select id="game-filter"><option value="All" data-i18n="filter.allGames">All Games</option></select>
                    </label>
                    <label class="field field-select">
                        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#sort"></use></svg>
                        <span class="visually-hidden" data-i18n="sort.label">Sort</span>
                        <select id="sort-order">
                            <option value="newest" data-i18n="sort.newest">Release Date: Newest First</option>
                            <option value="oldest" data-i18n="sort.oldest">Release Date: Oldest First</option>
                            <option value="name-asc" data-i18n="sort.nameAsc">Name: A-Z</option>
                            <option value="name-desc" data-i18n="sort.nameDesc">Name: Z-A</option>
                        </select>
                    </label>
                    <label class="field field-select">
                        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#layers"></use></svg>
                        <span class="visually-hidden" data-i18n="group.label">Group</span>
                        <select id="group-by">
                            <option value="none" data-i18n="group.none">No Grouping</option>
                            <option value="game" data-i18n="group.game">Group by Game</option>
                            <option value="year" data-i18n="group.year">Group by Year</option>
                        </select>
                    </label>
                </div>
                <div class="toolbar-meta">
                    <span id="result-count" class="result-count" aria-live="polite"></span>
                    <button type="button" id="active-tag" class="chip" hidden></button>
                    <button type="button" id="reset-filters" class="text-link" hidden data-i18n="filter.clear">Clear filters</button>
                </div>

                <div id="mods-grid" class="mods-grid">
                    <div class="card skeleton" aria-hidden="true"></div>
                    <div class="card skeleton" aria-hidden="true"></div>
                    <div class="card skeleton" aria-hidden="true"></div>
                </div>
                <noscript><p class="empty">This site needs JavaScript to list the mods. / Esta web necesita JavaScript para mostrar los mods.</p></noscript>
            </section>
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <dialog id="mod-dialog" class="mod-dialog"></dialog>
</body>
</html>
