name: Validate mods

on:
  push:
    paths: ["assets/data/**", "assets/mods/**", "tools/validate.py"]
  pull_request:
    paths: ["assets/data/**", "assets/mods/**", "tools/validate.py"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate.py
